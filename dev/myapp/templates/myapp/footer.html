<footer class="my-4">
  <ul class="nav justify-content-center border-bottom">
    {% with namespace=request.resolver_match.namespace url_name=request.resolver_match.url_name %}
    <li class="nav-item">
      <a class="nav-link px-2 {% if namespace == 'bootstrap3' %}text-warning{% endif %}"
        href="{% url 'bootstrap3:'|add:url_name %}">Use Bootstrap 3</a>
    </li>
    <li class="nav-item">
      <a class="nav-link px-2 {% if namespace == 'bootstrap4' %}text-warning{% endif %}"
        href="{% url 'bootstrap4:'|add:url_name %}">Use Bootstrap 4</a>
    </li>
    <li class="nav-item">
      <a class="nav-link px-2 {% if namespace == 'bootstrap5' %}text-warning{% endif %}"
        href="{% url 'bootstrap5:'|add:url_name %}">Use Bootstrap 5</a>
    </li>
    {% endwith %}
  </ul>
  <p class="text-center text-muted mt-4">Page generated by Django {{ django_version_string }}</p>
</footer>
