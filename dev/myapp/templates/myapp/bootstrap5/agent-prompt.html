{% if agent_prompt %}
<div class="card border-primary-subtle mt-3">
  <div class="card-header bg-primary-subtle text-primary-emphasis d-flex align-items-center gap-2">
    <i class="bi bi-robot"></i>
    <strong>Add to your project</strong>
  </div>
  <div class="card-body">
    <p class="text-muted mb-2">Copy and complete following prompt to your
      AI coding agent to add anything from this example to your project.</p>
    <textarea id="agent-prompt" class="form-control form-control-sm font-monospace bg-body-secondary" rows="16"
      readonly>{{ agent_prompt }}</textarea>
    <button class="btn btn-sm btn-primary mt-2 d-flex align-items-center gap-1"
      onclick="copyPrompt('agent-prompt', this)">
      <i class="bi bi-clipboard"></i> Copy prompt
    </button>
  </div>
</div>
<script>
  function copyPrompt(id, btn) {
    navigator.clipboard.writeText(document.getElementById(id).value).then(() => {
      btn.innerHTML = '<i class="bi bi-check-lg"></i> Copied!';
      setTimeout(() => btn.innerHTML = '<i class="bi bi-clipboard"></i> Copy prompt', 2000);
    });
  }
</script>
{% endif %}
